[project]
name = "fillwise"
version = "0.1.0"
description = "Missing-data audit and imputation benchmark: mechanism probes, disguised-zero repair, and leakage-safe strategy comparison"
authors = [{ name = "Ranjith Guggilla", email = "ranjithguggilla668@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "polars>=1.18",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
    "mlflow>=2.19",
    "matplotlib>=3.9",
    "gradio>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "pytest-cov>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fillwise"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
